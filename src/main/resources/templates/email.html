<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이메일 인증</title>
    <style>
        body { font-family: Arial, sans-serif; background:#f7f7f7; padding:24px; }
        .card { max-width:520px; margin:0 auto; background:#ffffff; border:1px solid #e5e5e5; border-radius:8px; }
        .header { background:#24292e; color:#ffffff; padding:16px 20px; border-radius:8px 8px 0 0; font-size:18px; font-weight:bold; }
        .content { padding:20px; color:#333333; line-height:1.6; }
        .code { display:inline-block; font-size:22px; font-weight:700; letter-spacing:2px; padding:10px 14px; background:#f0f4ff; border:1px dashed #6b7cff; border-radius:6px; margin:10px 0; }
        .footer { padding:16px 20px; color:#666666; font-size:12px; border-top:1px solid #eee; border-radius:0 0 8px 8px; }
    </style>
    <!-- Thymeleaf template -->
</head>
<body>
<div class="card">
    <div class="header">Tripcut 이메일 인증</div>
    <div class="content">
        <p>아래 인증번호를 회원가입 화면에 입력해 주세요.</p>
        <div class="code">[[${authCode}]]</div>
        <p>인증번호는 발송 시점으로부터 3분 동안 유효합니다.</p>
    </div>
    <div class="footer">
        본 메일은 발신 전용입니다. 문의는 서비스 내 고객센터를 이용해 주세요.
    </div>
    </div>
</body>
</html>
